name: VoiceDiary
options:
  bundleIdPrefix: com.chunqingliao
  deploymentTarget:
    iOS: "17.5"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "8X79G5XCU6"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: "complete"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VoiceDiary:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.chunqingliao.VoiceDiary"
        PRODUCT_NAME: "VoiceDiary"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_ENTITLEMENTS: "Support/VoiceDiary.entitlements"
        CODE_SIGN_STYLE: "Automatic"
        INFOPLIST_KEY_CFBundleDisplayName: "翻页日记"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: "zh-Hans"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "录制语音日记需要使用麦克风。录音只保存在你的设备和你自己的 iCloud，不会上传给我们或第三方。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "把语音转写成文字日记，识别全部在本机完成，不会上传。"
schemes:
  VoiceDiary:
    build:
      targets:
        VoiceDiary: all
    run:
      config: Debug
      storeKitConfiguration: Support/VoiceDiary.storekit
