name: VoiceDiary
options:
  bundleIdPrefix: com.chunqingliao
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.5"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "8X79G5XCU6"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: "complete"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  VoiceDiary:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - sdk: SpriteKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.chunqingliao.VoiceDiary"
        PRODUCT_NAME: "VoiceDiary"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_ENTITLEMENTS: "Support/VoiceDiary.entitlements"
        CODE_SIGN_STYLE: "Automatic"
        INFOPLIST_KEY_CFBundleDisplayName: "VoicePaper"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: "en"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # iPad 关闭多任务分屏，否则系统会忽略竖屏限制仍可横过来；纯竖屏靠这条兜底。
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Recording a voice diary needs the microphone. Audio stays on your device and your own iCloud — never uploaded to us or any third party."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Used to transcribe your voice into text. Recognition runs entirely on your device and is never uploaded."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Records where a diary entry was written. Used once while writing — never tracked continuously."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Uses Face ID or a passcode to keep your diary private, verifying you each time the app opens."
  VoiceDiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: VoiceDiary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: "com.chunqingliao.VoiceDiaryTests"
        PRODUCT_NAME: "VoiceDiaryTests"
schemes:
  VoiceDiary:
    build:
      targets:
        VoiceDiary: all
    run:
      config: Debug
      storeKitConfiguration: Support/VoiceDiary.storekit
    test:
      config: Debug
      targets:
        - VoiceDiaryTests
